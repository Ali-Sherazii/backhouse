# Backhouse: the whole stack in one `docker compose up -d`.
# Host ports bind to 127.0.0.1 only; public traffic goes through Caddy (80/443).

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://backhouse:${BACKHOUSE_DB_PASSWORD}@postgres:5432/backhouse
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET:-invoices}
  LANGFUSE_BUCKET: ${LANGFUSE_BUCKET:-langfuse}
  JWT_SECRET: ${JWT_SECRET}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
  AUTO_APPROVE_MIN_CONFIDENCE: ${AUTO_APPROVE_MIN_CONFIDENCE:-0.85}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL}
  API_INTERNAL_URL: http://api:8000
  N8N_EXPORT_WEBHOOK_URL: http://n8n:5678/webhook/backhouse-export
  ODOO_PUBLIC_URL: ${ODOO_PUBLIC_URL}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
  HF_TOKEN: ${HF_TOKEN:-}
  PROMPT_GUARD_MODEL: ${PROMPT_GUARD_MODEL:-meta-llama/Llama-Prompt-Guard-2-86M}
  GUARD_OCR_DIFF: ${GUARD_OCR_DIFF:-true}
  OCR_ENGINE: ${OCR_ENGINE:-docling}
  LANGFUSE_HOST: http://langfuse-web:3000
  LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL}
  LANGFUSE_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-backhouse}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
  SAMPLES_DIR: /samples
  HF_HOME: /models/hf

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL}
  NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
  AUTH_DISABLE_SIGNUP: "true"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_BUCKET:-langfuse}
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_BUCKET:-langfuse}
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-backhouse}
  LANGFUSE_INIT_ORG_NAME: Backhouse
  LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-backhouse}
  LANGFUSE_INIT_PROJECT_NAME: Backhouse extraction
  LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
  LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
  LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
  LANGFUSE_INIT_USER_NAME: Backhouse admin
  LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKHOUSE_DB_PASSWORD: ${BACKHOUSE_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Community-maintained MinIO build; upstream stopped publishing images in 2025.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

  ollama:
    image: ollama/ollama:0.35.1
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-data:/root/.ollama

  # One-shot: pulls the extraction model into the ollama volume, then exits.
  ollama-pull:
    image: ollama/ollama:0.35.1
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${LLM_MODEL:-qwen2.5:3b}"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    restart: unless-stopped
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    restart: unless-stopped
    environment: *backend-env
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "-Q", "backhouse", "--pool=solo", "--loglevel=INFO"]
    volumes:
      - model-cache:/models
    depends_on:
      api: { condition: service_healthy }

  # Light worker for the export hand-off to n8n, so approvals don't wait behind OCR/LLM jobs.
  exporter:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    restart: unless-stopped
    environment: *backend-env
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "-Q", "export", "--concurrency=2", "--loglevel=INFO"]
    depends_on:
      api: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_INTAKE_EMAIL: ${INTAKE_EMAIL:-}
    restart: unless-stopped
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]

  n8n:
    image: n8nio/n8n:1.123.83
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/backhouse/entrypoint.sh"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PROTOCOL: https
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      WEBHOOK_URL: ${N8N_PUBLIC_URL}/
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL}/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Values the workflows read through $env
      BACKHOUSE_API_URL: http://api:8000
      BACKHOUSE_APP_URL: ${APP_PUBLIC_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      ODOO_URL: http://odoo:8069
      ODOO_PUBLIC_URL: ${ODOO_PUBLIC_URL}
      ODOO_DB: ${ODOO_DB:-odoo}
      ODOO_LOGIN: ${ODOO_ADMIN_LOGIN:-admin}
      ODOO_PASSWORD: ${ODOO_ADMIN_PASSWORD}
      MAILPIT_URL: http://mailpit:8025
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-kitchen-manager@demo.backhouse}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./infra/n8n:/opt/backhouse:ro
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:5678:5678"]

  odoo:
    image: odoo:17.0
    restart: unless-stopped
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD}
    # `-i base` initialises the empty `odoo` database on first boot and is a no-op after.
    command: ["odoo", "-d", "${ODOO_DB:-odoo}", "--db-filter=^${ODOO_DB:-odoo}$$", "-i", "base", "--without-demo=all", "--no-database-list", "--proxy-mode"]
    volumes:
      - odoo-data:/var/lib/odoo
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:8069:8069"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8069/web/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  # One-shot, idempotent: demo company, account module, vendors, partner ids.
  odoo-seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment:
      <<: *backend-env
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-odoo}
      ODOO_ADMIN_LOGIN: ${ODOO_ADMIN_LOGIN:-admin}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD}
    command: ["python", "/infra/odoo_seed.py"]
    volumes:
      - ./infra:/infra:ro
    depends_on:
      odoo: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: "no"

  # One-shot, idempotent: claims the n8n owner account from .env before Caddy exposes n8n.
  n8n-owner:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment:
      N8N_URL: http://n8n:5678
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD}
    command: ["python", "/infra/n8n_owner.py"]
    volumes:
      - ./infra:/infra:ro
    depends_on:
      n8n: { condition: service_started }
    restart: "no"

  # Read-only reviewer logins for Odoo and Langfuse (same credentials as Backhouse).
  # Re-applies the demo password every 15 minutes, since Odoo users can change their own.
  demo-accounts:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-odoo}
      ODOO_ADMIN_LOGIN: ${ODOO_ADMIN_LOGIN:-admin}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD}
      DEMO_LOGIN: reviewer@demo.backhouse
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
      LANGFUSE_DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@postgres:5432/langfuse
      LANGFUSE_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-backhouse}
    command: ["python", "/infra/demo_accounts.py"]
    volumes:
      - ./infra:/infra:ro
    depends_on:
      odoo-seed: { condition: service_completed_successfully }
      langfuse-web: { condition: service_started }

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    environment: *langfuse-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      minio: { condition: service_started }

  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    environment: *langfuse-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      minio: { condition: service_started }
    ports: ["127.0.0.1:3001:3000"]

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"
      # On the server: only accept mail for the intake address. Empty (local) accepts anything.
      MP_SMTP_ALLOWED_RECIPIENTS: ${INTAKE_EMAIL:-}
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
      # Public SMTP for email intake. Set SMTP_PUBLIC_BIND=0.0.0.0 on the server and open TCP 25.
      - "${SMTP_PUBLIC_BIND:-127.0.0.1}:25:1025"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      N8N_DOMAIN: ${N8N_DOMAIN}
      ODOO_DOMAIN: ${ODOO_DOMAIN}
      TRACES_DOMAIN: ${TRACES_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports: ["80:80", "443:443"]
    # Nothing is public until n8n has its owner and Odoo's default admin password is gone.
    depends_on:
      frontend: { condition: service_started }
      api: { condition: service_healthy }
      n8n-owner: { condition: service_completed_successfully }
      odoo-seed: { condition: service_completed_successfully }

volumes:
  postgres-data:
  redis-data:
  minio-data:
  ollama-data:
  model-cache:
  n8n-data:
  odoo-data:
  clickhouse-data:
  clickhouse-logs:
  caddy-data:
  caddy-config:
